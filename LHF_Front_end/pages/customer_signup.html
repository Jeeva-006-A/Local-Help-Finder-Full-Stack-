<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sign Up - Local Help Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    <nav class="landing-nav">
        <a href="../../index.html" class="nav-brand">
            <i class="fas fa-tools"></i> Local Help Finder
        </a>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="contact.html">Contact Us</a>
        </div>
    </nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <div class="auth-container">
        <div class="auth-left">
            <div>
                <h1> Local Help Finder </h1>
                <p class="tagline">Join thousands of satisfied customers</p>
                <p class="description">Create your account in seconds</p>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-box">
                <a href="../../index.html" class="back-link"> Back to Home</a>

                <h2>Customer Sign Up</h2>
                <p class="subtitle">Create your account to get started</p>

                <form id="customerSignupForm">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Full Name *</label>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email Address *</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> Phone Number *</label>
                        <input type="tel" id="phone" placeholder="Enter your phone number" required minlength="10"
                            maxlength="10" pattern="\d{10}">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt"></i> Complete Address *</label>
                        <textarea id="address" placeholder="Enter your complete address" required></textarea>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password *</label>
                        <input type="password" id="password" placeholder="Create a password (min 6 characters)" required
                            minlength="6" maxlength="20">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-shield-alt"></i> Confirm Password *</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required
                            minlength="6" maxlength="20">
                    </div>

                    <label class="checkbox">
                        <input type="checkbox" id="terms" required>
                        <span>I agree to the Terms & Conditions</span>
                    </label>

                    <button type="submit" class="btn-primary">Create Account</button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="customer_login.html">Login</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/alerts.js"></script>
    <script src="../js/customer_signup.js"></script>
</body>

</html>
