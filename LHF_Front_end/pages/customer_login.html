<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Local Help Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    <nav class="landing-nav">
        <a href="../../index.html" class="nav-brand">
            <i class="fas fa-tools"></i> Local Help Finder
        </a>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="contact.html">Contact Us</a>
        </div>
    </nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <div class="auth-container">
        <div class="auth-left">
            <div>
                <h1> Local Help Finder </h1>
                <p class="tagline">Your trusted platform for home services</p>
                <p class="description">Book verified professionals instantly</p>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-box">
                <a href="../../index.html" class="back-link"> Back to Home</a>

                <h2>Customer Login</h2>
                <p class="subtitle">Welcome back! Login to your account</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email or Username *</label>
                        <input type="text" id="identifier" placeholder="Enter your email or username" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password *</label>
                        <input type="password" id="password" placeholder="Enter your password" required minlength="6"
                            maxlength="20">
                    </div>

                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox" id="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary">Login as Customer</button>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="customer_signup.html">Sign Up</a>
                </div>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="auth-footer">
                    Are you a service provider? <a href="worker_login.html">Login as Worker</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/customer_login.js"></script>
</body>

</html>
