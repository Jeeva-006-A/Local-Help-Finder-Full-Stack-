<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Local Help Finder</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="brand">LHF Admin</div>
            <ul class="nav-links">
                <li><a href="#" class="active"><i class="fas fa-user-check"></i> Verifications</a></li>
                
            </ul>
            <a href="../../index.html" class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </aside>

        
        <main class="main-content">
            <header>
                <div>
                    <h1>Worker Verification</h1>
                    <p style="color: var(--text-secondary);">Manage and verify service providers</p>
                </div>
                <div class="admin-user">
                    <span>Welcome, <strong id="adminName">Admin</strong></span>
                </div>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <p style="color: var(--text-secondary);">Total Professionals</p>
                    <h2 id="totalCount">0</h2>
                </div>
                <div class="stat-card">
                    <p style="color: var(--text-secondary);">Pending Verifications</p>
                    <h2 id="pendingCount">0</h2>
                </div>
            </div>

            <div class="data-section">
                <div class="section-header"
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h3>Service Providers Management</h3>
                    <div class="filters">
                        <select id="statusFilter" onchange="loadWorkers()"
                            style="padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);">
                            <option value="all">All Workers</option>
                            <option value="pending">Pending Only</option>
                            <option value="verified">Verified Only</option>
                            <option value="rejected">Rejected/Blocked</option>
                        </select>
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table id="workerTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Status</th>
                                <th>Email</th>
                                <th>ID Proof</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="workerTableBody">
                            
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="workerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalWorkerName">Worker Details</h2>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalContent">
                
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        // Check Auth
        const adminUser = localStorage.getItem('admin_user');
        if (!adminUser) {
            window.location.href = 'customer_login.html';
        }
        document.getElementById('adminName').textContent = adminUser;

        let allWorkersList = [];

        // Load All Workers
        async function loadWorkers() {
            try {
                const workers = await AdminAPI.getAllWorkers();
                allWorkersList = workers;
                const tableBody = document.getElementById('workerTableBody');
                const pendingCountEl = document.getElementById('pendingCount');
                const totalCountEl = document.getElementById('totalCount');
                const filter = document.getElementById('statusFilter').value;

                tableBody.innerHTML = '';

                const pendingCount = workers.filter(w => w.status === 'pending').length;
                pendingCountEl.textContent = pendingCount;
                totalCountEl.textContent = workers.length;

                const filteredWorkers = filter === 'all'
                    ? workers
                    : workers.filter(w => w.status === filter);

                if (filteredWorkers.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-secondary); padding: 3rem;">No ${filter !== 'all' ? filter : ''} workers found</td></tr>`;
                    return;
                }

                filteredWorkers.forEach(worker => {
                    const statusClass = worker.status === 'verified' ? 'success' : (worker.status === 'pending' ? 'warning' : 'danger');
                    const row = `
                        <tr>
                            <td><strong>${worker.full_name}</strong></td>
                            <td><span class="badge">${worker.category}</span></td>
                            <td><span class="badge-${statusClass}">${worker.status.toUpperCase()}</span></td>
                            <td>${worker.email}</td>
                            <td>
                                <button class="btn-action" onclick="viewAadhar('${worker.aadhar_photo}')">
                                    <i class="fas fa-eye"></i> View ID
                                </button>
                            </td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn-action" onclick="viewWorkerDetails(${worker.id})" title="View Full Details">
                                        <i class="fas fa-info-circle"></i> Details
                                    </button>
                                    ${worker.status === 'pending' ? `
                                        <button class="btn-verify" onclick="updateStatus(${worker.id}, 'verified')">Verify</button>
                                        <button class="btn-reject" onclick="updateStatus(${worker.id}, 'rejected')">Block</button>
                                    ` : `
                                        <button class="btn-reset" onclick="updateStatus(${worker.id}, 'pending')">Reset</button>
                                        ${worker.status === 'verified' ?
                            `<button class="btn-reject" onclick="updateStatus(${worker.id}, 'rejected')">Block</button>` :
                            `<button class="btn-verify" onclick="updateStatus(${worker.id}, 'verified')">Unblock</button>`
                        }
                                    `}
                                    <button class="btn-delete" onclick="deleteWorker(${worker.id})">
                                        <i class="fas fa-trash"></i> Delete
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error loading workers:", error);
            }
        }

        function viewWorkerDetails(id) {
            const worker = allWorkersList.find(w => w.id === id);
            if (!worker) return;

            document.getElementById('modalWorkerName').textContent = worker.full_name;
            const content = `
                <div class="detail-row">
                    <span class="detail-label">Email Address</span>
                    <span class="detail-value">${worker.email}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Phone Number</span>
                    <span class="detail-value">${worker.phone || 'Not provided'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Category</span>
                    <span class="detail-value">${worker.category}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Experience</span>
                    <span class="detail-value">${worker.experience} Years</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Address</span>
                    <span class="detail-value">${worker.address}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Current Status</span>
                    <span class="detail-value">${worker.status.toUpperCase()}</span>
                </div>
            `;
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('workerModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('workerModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('workerModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        function viewAadhar(url) {
            if (!url || url === 'null') {
                alert("No ID photo uploaded.");
                return;
            }
            window.open(url, '_blank');
        }

        async function updateStatus(workerId, status) {
            if (!confirm(`Are you sure you want to change status to ${status}?`)) return;

            try {
                await AdminAPI.updateWorkerStatus(workerId, status);
                alert(`Status updated to ${status}`);
                loadWorkers();
            } catch (error) {
                alert("Operation failed: " + error.message);
            }
        }

        async function deleteWorker(workerId) {
            if (!confirm("Are you sure you want to PERMANENTLY delete this worker? This action cannot be undone.")) return;

            try {
                await AdminAPI.deleteWorker(workerId);
                alert("Worker deleted successfully.");
                loadWorkers(); // This refreshes the details for the admin
            } catch (error) {
                alert("Deletion failed: " + error.message);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('admin_user');
        });

        // Initialize
        loadWorkers();
    </script>
</body>

</html>
