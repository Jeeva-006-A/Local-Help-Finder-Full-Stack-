<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Login - Local Help Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="worker-page">
    <nav class="landing-nav">
        <a href="../../index.html" class="nav-brand">
            <i class="fas fa-tools"></i> Local Help Finder
        </a>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="contact.html">Contact Us</a>
        </div>
    </nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <div class="auth-container">
        <div class="auth-left worker-gradient">
            <div>
                <h1>Local Help Finder</h1>
                <p class="tagline">For service professionals</p>
                <p class="description">Grow your business with us</p>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-box">
                <a href="../../index.html" class="back-link"> Back to Home</a>

                <h2>Worker Login</h2>
                <p class="subtitle">Access your professional dashboard</p>

                <form id="workerLoginForm" action="worker_dashboard.html">
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email Address *</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password *</label>
                        <input type="password" id="password" placeholder="Enter your password" required minlength="6"
                            maxlength="20">
                    </div>

                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox" id="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary worker-btn">Login</button>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="worker_signup.html">Sign Up</a>
                </div>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="auth-footer">
                    Are you a customer? <a href="customer_login.html">Login as Customer</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/alerts.js"></script>
    <script src="../js/worker_login.js"></script>
</body>

</html>
