<!DOCTYPE html>
<html lang="en">

<title>Worker Sign Up - Local Help Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="../css/auth.css">
</head>

<body class="worker-page">
    <nav class="landing-nav">
        <a href="../../index.html" class="nav-brand">
            <i class="fas fa-tools"></i> Local Help Finder
        </a>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="contact.html">Contact Us</a>
        </div>
    </nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <div class="auth-container">
        <div class="auth-left worker-gradient">
            <div>
                <h1>Local Help Finder</h1>
                <p class="tagline">Join our network of professionals</p>
                <p class="description">Start earning today</p>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-box">
                <a href="../../index.html" class="back-link">Back to Home</a>

                <h2>Worker Sign Up</h2>
                <p class="subtitle">Register as a service professional</p>

                <form id="workerSignupForm">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Full Name *</label>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email Address *</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> Phone Number *</label>
                        <input type="tel" id="phone" placeholder="Enter your phone number" required minlength="10"
                            maxlength="10" pattern="\d{10}">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-briefcase"></i> Service Category *</label>
                        <select id="category" required>
                            <option value="">Select your service</option>
                            <option value="plumber">Plumber</option>
                            <option value="electrician">Electrician</option>
                            <option value="mechanic">Mechanic</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-star-half-alt"></i> Years of Experience *</label>
                        <input type="number" id="experience" placeholder="Enter years of experience" min="0" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt"></i> Complete Address *</label>
                        <textarea id="address" placeholder="Enter your complete address" required></textarea>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-id-card"></i> Aadhaar Card Photo * (For Verification)</label>
                        <input type="file" id="aadharPhoto" accept="image/*" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password *</label>
                        <input type="password" id="password" placeholder="Create a password (min 6 characters)" required
                            minlength="6" maxlength="20">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-shield-alt"></i> Confirm Password *</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required
                            minlength="6" maxlength="20">
                    </div>

                    <label class="checkbox">
                        <input type="checkbox" id="terms" required>
                        <span>I agree to the Terms & Conditions</span>
                    </label>

                    <button type="submit" class="btn-primary worker-btn">Create Account</button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="worker_login.html">Login</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/connections/config.js"></script>
    <script src="../js/connections/auth.js"></script>
    <script src="../js/frontend/worker_signup.js"></script>
</body>

</html>
